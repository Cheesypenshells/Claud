<style>
:root{--navy:#22348C;--navy-tua:#16226A;--kuning:#F6B800;--kuning-muda:#FFF1BF;--kertas:#F7F6F1;--putih:#FFFFFF;--teks:#1A2050;--redup:#5F6690;--garis:#DCDDEA;--hijau:#0B8043;--merah:#D93025;--abu:#8A8FA8; --judul:"Barlow Condensed","Arial Narrow",Impact,sans-serif;--isi:"Nunito",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;--skrip:"Caveat","Comic Sans MS",cursive;--kuas:url("data:image/svg+xml,%3Csvg xmlns=%27http://www.w3.org/2000/svg%27 viewBox=%270 0 400 60%27 preserveAspectRatio=%27none%27%3E%3Cpath fill=%27%23F6B800%27 d=%27M8 16C62 5 140 11 212 6 C282 2 350 9 394 12 L386 21 L398 29 L384 40 C330 52 252 47 182 54 C120 59 62 52 10 49 L19 39 L2 31 L15 23Z%27/%3E%3Cpath fill=%27%23F6B800%27 opacity=%27.55%27 d=%27M30 8 L120 4 L118 7 L32 11Z M250 52 L360 48 L358 51 L252 55Z%27/%3E%3C/svg%3E")}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;font-family:var(--isi);font-size:16px;line-height:1.5;color:var(--teks);background:var(--kertas) url("data:image/svg+xml,%3Csvg xmlns=%27http://www.w3.org/2000/svg%27 width=%27260%27 height=%27150%27%3E%3Cg fill=%27%2322348C%27 fill-opacity=%27.075%27 font-family=%27Arial,sans-serif%27 font-weight=%27900%27 font-size=%2712%27 transform=%27rotate%28-8 130 75%29%27%3E%3Ctext x=%270%27 y=%2720%27%3ECHEESY PEN SHELLS %C2%B7 oyster bakar %C2%B7%3C/text%3E%3Ctext x=%27-60%27 y=%2752%27%3Echeesy pen shells %C2%B7 CHEESY PEN SHELLS%3C/text%3E%3Ctext x=%2710%27 y=%2784%27%3Eoyster %C2%B7 CHEESY PEN SHELLS %C2%B7 bakar%3C/text%3E%3Ctext x=%27-40%27 y=%27116%27%3ECHEESY PEN SHELLS %C2%B7 cheesy pen shells%3C/text%3E%3Ctext x=%270%27 y=%27148%27%3Ebakar %C2%B7 CHEESY PEN SHELLS %C2%B7 oyster %C2%B7%3C/text%3E%3C/g%3E%3C/svg%3E") repeat}
a{color:var(--navy);font-weight:700}
header,.kepala{background:var(--navy);color:var(--putih);padding:10px max(16px,env(safe-area-inset-right,0px)) 14px max(16px,env(safe-area-inset-left,0px));display:flex;align-items:center;gap:12px;position:relative;font-weight:800}
header::after,.kepala::after{content:"";position:absolute;left:0;right:0;bottom:-7px;height:12px;background:var(--kuas) center/100% 100% no-repeat}
header img,.kepala img{width:52px;height:52px;object-fit:contain;flex:none}
.merek{display:flex;flex-direction:column;line-height:1.05;min-width:0}
.merek b{font-family:var(--judul);font-weight:800;font-size:24px;letter-spacing:.04em}
.merek small{font-family:var(--skrip);font-size:19px;color:var(--kuning);font-weight:700}
header .kanan{margin-left:auto;font-family:var(--judul);font-size:20px;color:var(--kuning)}
main{padding:22px max(16px,env(safe-area-inset-right,0px)) 28px max(16px,env(safe-area-inset-left,0px));max-width:1100px;margin:0 auto}
.kartu{background:var(--putih);border-radius:18px;padding:18px;margin-bottom:16px;border:2px solid var(--garis);box-shadow:0 3px 0 var(--garis)}
h2,h3{font-family:var(--judul);font-weight:800;letter-spacing:.02em;text-transform:uppercase;color:var(--navy);margin:0 0 10px}
h3{font-size:22px}
.judul{font-size:26px;line-height:1.1;margin:0 0 12px}
.judul span{display:inline-block;padding:4px 18px 6px;background:var(--kuas) center/100% 100% no-repeat}
.skrip{font-family:var(--skrip);font-size:24px;color:var(--navy);margin:-6px 0 10px;font-weight:700}
button,.tombol{border:0;border-radius:14px;padding:15px 16px;font:800 17px var(--isi);cursor:pointer;background:var(--navy);color:var(--putih);width:100%;box-shadow:0 4px 0 var(--navy-tua);display:block}
button:active,.tombol:active{transform:translateY(2px);box-shadow:0 2px 0 var(--navy-tua)}
button:focus-visible,.tombol:focus-within,a:focus-visible,input:focus-visible,textarea:focus-visible,select:focus-visible{outline:3px solid var(--kuning);outline-offset:2px}
button.kecil{padding:10px 12px;font-size:14px;width:auto;box-shadow:0 3px 0 rgba(0,0,0,.18)}
button.hijau{background:var(--hijau)}button.biru{background:var(--navy)}button.abu{background:var(--abu)}button.merah{background:var(--merah)}
button.kuning,.tombol.kuning{background:var(--kuning);color:var(--navy-tua);box-shadow:0 4px 0 #C99700}
input,select,textarea{width:100%;padding:13px;border:2px solid var(--garis);border-radius:12px;font:16px var(--isi);color:var(--teks);background:var(--putih)}
label{font-weight:800;display:block;margin:12px 0 6px}
.nomor{font-family:var(--judul);font-size:96px;font-weight:800;color:var(--navy);text-align:center;line-height:.95}
.redup{color:var(--redup);font-size:14px}
.lencana{display:inline-block;padding:6px 14px;border-radius:999px;font-weight:800;color:var(--putih);font-size:15px}
.MENUNGGU{background:var(--abu)}.DIBAKAR{background:#E8710A}.SIAP{background:var(--hijau)}.DIAMBIL{background:var(--navy)}.BATAL{background:var(--merah)}
img.foto{width:100%;border-radius:14px;display:block;background:#E9E9F2}
.kolom{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:14px}@media(max-width:800px){.kolom{grid-template-columns:1fr}}
.kolom h3{display:inline-block;padding:2px 16px 4px;background:var(--kuas) center/100% 100% no-repeat}
.pesanan{background:var(--putih);border-radius:14px;padding:12px;margin-bottom:10px;border:2px solid var(--garis);border-left:8px solid var(--abu)}.pesanan.DIBAKAR{border-left-color:#E8710A}.pesanan.SIAP{border-left-color:var(--hijau)}
.pesanan .no{font-family:var(--judul);font-size:36px;font-weight:800;color:var(--navy);line-height:1}.pesanan img{width:86px;height:86px;object-fit:cover;border-radius:10px;float:right;margin-left:8px}
.aksi{display:flex;gap:6px;flex-wrap:wrap;margin-top:10px;clear:both}
.modal{position:fixed;inset:0;background:rgba(22,34,106,.7);display:flex;align-items:center;justify-content:center;padding:16px;z-index:9}
.modal .kartu{max-width:440px;width:100%;max-height:92vh;overflow:auto}
.pilihan label{font-weight:600;display:flex;gap:10px;align-items:center;background:var(--putih);border:2px solid var(--garis);border-radius:12px;padding:12px;margin:6px 0}
.pilihan label:has(input:checked){border-color:var(--navy);background:var(--kuning-muda)}
.pilihan input{width:auto;accent-color:var(--navy)}
/* tiket antrian pelanggan */ .tiket{background:var(--putih);border-radius:22px;padding:18px 18px 16px;margin-bottom:16px;text-align:center;border:3px solid var(--navy);box-shadow:0 6px 0 var(--navy);position:relative}
.tiket::before,.tiket::after{content:"";position:absolute;top:56%;width:22px;height:22px;border-radius:50%;background:var(--kertas);border:3px solid var(--navy)}
.tiket::before{left:-13px;border-left-color:transparent;border-bottom-color:transparent;transform:rotate(45deg)}.tiket::after{right:-13px;border-right-color:transparent;border-top-color:transparent;transform:rotate(45deg)}
.uap{display:flex;justify-content:center;color:var(--navy);margin-bottom:-4px}.uap svg{width:84px;height:36px}
.tiket .label{font-family:var(--skrip);font-size:24px;font-weight:700;color:var(--redup)}
.tiket .nomor{font-size:120px}
.langkah{list-style:none;display:flex;gap:6px;padding:0;margin:16px 0 14px;counter-reset:l}
.langkah li{flex:1;display:flex;flex-direction:column;align-items:center;gap:4px;font-size:13px;font-weight:700;color:var(--abu);position:relative}
.langkah li span{width:44px;height:44px;border-radius:50%;display:grid;place-items:center;font-size:21px;background:#EEEFF5;border:2px dashed var(--garis)}
.langkah li.lewat span{background:var(--kuning-muda);border:2px solid var(--kuning)}.langkah li.lewat{color:var(--navy)}
.langkah li.kini span{background:var(--kuning);border:2px solid var(--navy);animation:denyut 1.6s ease-in-out infinite}.langkah li.kini{color:var(--navy)}
@keyframes denyut{50%{transform:scale(1.1)}}
.info{display:grid;grid-template-columns:1fr 1fr;border-top:2px dashed var(--garis);margin-top:4px}
.info div{padding:10px 4px 2px;display:flex;flex-direction:column}.info div+div{border-left:2px dashed var(--garis)}
.info small{color:var(--redup);font-weight:700}.info b{font-family:var(--judul);font-size:34px;color:var(--navy);line-height:1.1}
.lokasi{margin-top:8px;color:var(--redup);font-size:14px;font-weight:700}
.menu-pesanan{white-space:pre-line;font-size:19px;font-weight:800;color:var(--navy)}
details{margin-top:12px}summary{cursor:pointer;font-weight:800;color:var(--navy)}details img{margin-top:10px}
.ajak{background:var(--kuning);border-radius:18px;padding:14px;margin-bottom:16px;box-shadow:0 4px 0 #C99700;text-align:center}
.ajak button{background:var(--navy)}.ajak p{margin:10px 0 0;font-weight:700;color:var(--navy-tua);font-size:14px}
.ajak.aktif{background:var(--kuning-muda);box-shadow:none;border:2px solid var(--kuning)}
.geser{display:flex;gap:12px;overflow-x:auto;scroll-snap-type:x mandatory;padding:4px 2px 12px;margin:0 -2px}
.geser figure{flex:0 0 74%;max-width:300px;margin:0;scroll-snap-align:start;background:var(--putih);border-radius:16px;overflow:hidden;border:2px solid var(--garis)}
.geser img{width:100%;aspect-ratio:1/1.1;object-fit:cover;display:block}
.geser figcaption{padding:8px 12px;font-weight:800;color:var(--navy);display:flex;justify-content:space-between;gap:8px}
.geser figcaption em{font-style:normal;background:var(--kuning);border-radius:999px;padding:0 10px;color:var(--navy-tua)}
.poster{width:100%;border-radius:18px;display:block;margin-top:6px;border:3px solid var(--navy)}
.kaki{text-align:center;padding:18px 0 4px;display:flex;flex-direction:column;gap:6px;font-size:14px;color:var(--redup)}
.kaki .tagar{font-family:var(--skrip);font-size:22px;color:var(--navy);font-weight:700}
.siap-besar{position:fixed;inset:0;background:var(--kuning);color:var(--navy-tua);display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:24px;z-index:10;gap:6px}
.siap-besar .judul-siap{font-family:var(--judul);font-weight:800;font-size:40px;line-height:1;text-transform:uppercase}
.siap-besar .nomor{font-size:150px;color:var(--navy)}.siap-besar .uap svg{width:120px;height:52px}
.siap-besar p{font-weight:800;font-size:19px;margin:0}.siap-besar small{opacity:.75;font-weight:700}
@media (prefers-reduced-motion:reduce){.langkah li.kini span{animation:none}}.ig{display:flex;align-items:center;gap:14px;background:var(--navy);color:var(--putih);border-radius:18px;padding:16px;margin-bottom:16px;text-decoration:none;box-shadow:0 4px 0 var(--navy-tua)}
.ig svg{width:46px;height:46px;flex:none;color:var(--kuning)}
.ig span{display:flex;flex-direction:column;line-height:1.25;min-width:0}
.ig small{font-weight:700;opacity:.85}
.ig b{font-family:var(--judul);font-size:26px;letter-spacing:.02em}
.ig em{margin-left:auto;flex:none;font-style:normal;background:var(--kuning);color:var(--navy-tua);border-radius:999px;padding:8px 14px;font-weight:800;font-size:14px}
.ig:active{transform:translateY(2px)}.cara{list-style:none;padding:0;margin:14px 0 0;display:grid;gap:10px;counter-reset:c}
.cara li{counter-increment:c;display:grid;grid-template-columns:36px minmax(0,1fr);gap:10px;align-items:start}
.cara li::before{content:counter(c);width:36px;height:36px;border-radius:50%;background:var(--kuning);color:var(--navy-tua);font:800 20px var(--judul);display:grid;place-items:center}
.cara b{color:var(--navy)}
.tepok .poster{border-width:2px}

/* ---- sesi kasir ---- */
.sesi{margin-top:14px;border-radius:16px;padding:14px;border:2px dashed var(--garis)}
.sesi.buka{border:2px solid var(--hijau);background:#EFF8F2}
.sesi.tutup{background:var(--kuning-muda);border-color:var(--kuning)}
.lampu{display:inline-block;width:10px;height:10px;border-radius:50%;background:var(--hijau);margin-right:6px;box-shadow:0 0 0 0 rgba(11,128,67,.5);animation:lampu 1.6s infinite}
@keyframes lampu{70%{box-shadow:0 0 0 8px rgba(11,128,67,0)}100%{box-shadow:0 0 0 0 rgba(11,128,67,0)}}
.ringkas{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px;margin:12px 0}
.ringkas div{background:var(--kuning-muda);border-radius:14px;padding:10px;text-align:center}
.ringkas b{display:block;font-family:var(--judul);font-size:34px;color:var(--navy);line-height:1}
.ringkas small{font-weight:700;color:var(--redup)}
/* ---- penilaian bintang ---- */
.nilai{text-align:center}
.baris-bintang{display:flex;justify-content:center;gap:6px;margin:8px 0 2px}
.bintang{width:52px;height:52px;padding:0;border-radius:50%;font-size:34px;line-height:1;background:#EEEFF5;color:#C9CBDB;box-shadow:none}
.bintang.nyala{background:var(--kuning-muda);color:var(--kuning)}
.label-bintang{font-weight:800;color:var(--navy);margin:4px 0 8px}
.bintang-teks{color:var(--kuning);font-size:22px;letter-spacing:2px}
button:disabled{opacity:.5;cursor:not-allowed}
/* ---- panggung animasi di kiri & kanan nomor ---- */
.panggung{display:grid;grid-template-columns:minmax(0,1fr) auto minmax(0,1fr);align-items:end;gap:4px}
.panggung .sisi{display:flex;justify-content:center;min-width:0}
.adegan{width:100%;max-width:110px;height:auto;overflow:visible}
.adegan.a-laut{overflow:hidden;border-radius:0 0 12px 12px}
.tiket .nomor.panjang{font-size:92px}
.cerita{font-size:14px;font-weight:700;color:var(--redup);margin:6px 0 10px}
.siap-besar .panggung{width:100%;max-width:460px;background:var(--putih);border-radius:22px;padding:10px 8px;box-shadow:0 6px 0 rgba(22,34,106,.18)}
.siap-besar .adegan{max-width:130px}
/* uap di atas nomor: bergoyang seperti asap */
.uap path{animation:uap 2.4s ease-in-out infinite;transform-box:fill-box;transform-origin:50% 100%}
.uap .u2{animation-delay:-.8s}.uap .u3{animation-delay:-1.6s}
@keyframes uap{0%,100%{transform:translateY(0) skewX(0);opacity:1}25%{transform:translateY(-2px) skewX(8deg)}50%{transform:translateY(-4px) skewX(-6deg);opacity:.75}75%{transform:translateY(-2px) skewX(5deg)}}
/* bagian tubuh */
.adegan .kepala,.adegan .lengan-kiri,.adegan .lengan-kanan,.adegan .koki,.adegan g{transform-box:view-box}
/* menunggu: membungkuk terima kasih, perahu & ombak, tiram terbang ke dapur */
.a-terimakasih .koki{transform-origin:40px 104px;animation:bungkuk 2.2s ease-in-out infinite}
@keyframes bungkuk{0%,55%,100%{transform:rotate(0)}20%,40%{transform:rotate(14deg)}}
.a-terimakasih .gelembung{animation:muncul 2.2s ease-in-out infinite}
@keyframes muncul{0%,10%{opacity:0;transform:translateY(4px)}25%,85%{opacity:1;transform:none}100%{opacity:0}}
.a-laut .ombak{animation:ombak 2.4s linear infinite}
@keyframes ombak{to{transform:translateX(40px)}}
.a-laut .perahu{animation:goyang 2.4s ease-in-out infinite;transform-origin:30px 96px}
@keyframes goyang{0%,100%{transform:rotate(-4deg) translateY(0)}50%{transform:rotate(4deg) translateY(2px)}}
.a-laut .tiram-terbang{animation:tiram 4s ease-in-out infinite}
@keyframes tiram{0%{transform:translate(38px,100px) scale(.6);opacity:0}15%{opacity:1}35%{transform:translate(38px,60px) scale(.8)}75%{transform:translate(64px,22px) scale(.7);opacity:1}85%,100%{transform:translate(66px,24px) scale(.3);opacity:0}}
.a-laut .asap-dapur{animation:uap 2s ease-in-out infinite}
/* dibakar: joget keren, keju jatuh, api menari, asap */
.a-joget .penari{transform-origin:40px 106px;animation:joget .8s ease-in-out infinite alternate}
@keyframes joget{0%{transform:rotate(-8deg) translateY(0)}50%{transform:rotate(0) translateY(-4px)}100%{transform:rotate(8deg) translateY(0)}}
.a-joget .lengan-kiri{animation:ayun .4s ease-in-out infinite alternate}
@keyframes ayun{from{transform:rotate(-15deg)}to{transform:rotate(20deg)}}
.a-joget .lengan-kanan{animation:tabur .6s ease-in-out infinite alternate}
@keyframes tabur{from{transform:rotate(0)}to{transform:rotate(-18deg)}}
.a-joget .keju{animation:jatuh 1.2s linear infinite;opacity:0}
.a-joget .k1{animation-delay:.2s}.a-joget .k2{animation-delay:.4s}.a-joget .k3{animation-delay:.6s}.a-joget .k4{animation-delay:.8s}.a-joget .k5{animation-delay:1s}
@keyframes jatuh{0%{transform:translateY(0);opacity:0}10%{opacity:1}100%{transform:translateY(48px);opacity:0}}
.a-joget .not{animation:muncul 1.6s ease-in-out infinite}
.a-panggang .f{transform-origin:50% 100%;transform-box:fill-box;animation:api .5s ease-in-out infinite alternate}
.a-panggang .f2{animation-duration:.4s}.a-panggang .f3{animation-duration:.6s}
@keyframes api{from{transform:scaleY(.8) skewX(-4deg)}to{transform:scaleY(1.12) skewX(4deg)}}
.a-panggang .asap-panggang path{animation:uap 2s ease-in-out infinite}
/* siap: koki memeluk makanan, cemas; anjing mengejar */
.a-jaga .penjaga{animation:waspada 1.8s ease-in-out infinite;transform-origin:40px 110px}
@keyframes waspada{0%,100%{transform:translate(0,8px) rotate(0)}30%{transform:translate(-3px,8px) rotate(-5deg)}60%{transform:translate(2px,8px) rotate(4deg)}}
.a-jaga .keringat{animation:keringat 1.2s ease-in infinite}
@keyframes keringat{0%{transform:translateY(0);opacity:1}100%{transform:translateY(8px);opacity:0}}
.a-jaga .pikir{animation:muncul 3s ease-in-out infinite}
.a-anjing .anjing{animation:lompat .35s ease-in-out infinite alternate}
.a-anjing .a2{animation-delay:.12s}.a-anjing .a3{animation-delay:.24s}
@keyframes lompat{from{translate:0 0}to{translate:0 -4px}}
.a-anjing .lari{animation:kejar 1.6s ease-in-out infinite alternate}
@keyframes kejar{from{transform:translateX(6px)}to{transform:translateX(-8px)}}
.a-anjing .ka{animation:langkah .2s linear infinite alternate}.a-anjing .kb{animation:langkah .2s linear infinite alternate-reverse}
@keyframes langkah{from{transform:translateX(-1.5px)}to{transform:translateX(1.5px)}}
.a-anjing .ekor{animation:ayun .15s linear infinite alternate;transform-box:fill-box;transform-origin:0 100%}
.a-anjing .guk{animation:muncul 1s ease-in-out infinite}
.a-anjing .debu circle{animation:debu 1s ease-out infinite}
@keyframes debu{from{opacity:.9;transform:translateX(0)}to{opacity:0;transform:translateX(10px)}}
.a-hati text{animation:naik 2.4s ease-in infinite;opacity:0}
.a-hati .h2{animation-delay:.8s}.a-hati .h3{animation-delay:1.6s}
@keyframes naik{0%{transform:translateY(0);opacity:0}20%{opacity:1}100%{transform:translateY(-70px);opacity:0}}
@media (prefers-reduced-motion:reduce){.adegan *,.uap path,.lampu{animation:none!important}}

/* ---- gerak ala kartun klasik: memantul, mengempis-memanjang, kepala mendongak saat gembira ---- */
.adegan{filter:drop-shadow(0 3px 2px rgba(22,34,106,.28))}
.adegan .tubuh,.adegan .bayangan,.adegan .kaki-kiri,.adegan .kaki-kanan{transform-box:view-box}
.adegan .tubuh{transform-origin:40px 107px;animation:napas 1.1s ease-in-out infinite}
.adegan .bayangan{transform-origin:40px 107px;animation:bayang-napas 1.1s ease-in-out infinite}
@keyframes napas{0%,100%{transform:scale(1,1)}50%{transform:scale(1.03,.97)}}
@keyframes bayang-napas{0%,100%{transform:scale(1)}50%{transform:scale(1.06)}}
.a-laut .bayangan{display:none}
/* menunggu: membungkuk "makasih" lalu melompat kecil kegirangan */
.a-terimakasih .koki{animation:none}
.a-terimakasih .tubuh{animation:makasih 2.2s cubic-bezier(.4,0,.2,1) infinite}
@keyframes makasih{0%{transform:scale(1,1)}12%{transform:scale(1.06,.92)}24%,40%{transform:rotate(16deg) scale(1,1)}52%{transform:scale(1.08,.9)}64%{transform:translateY(-10px) scale(.94,1.07)}76%{transform:translateY(0) scale(1.08,.92)}88%,100%{transform:scale(1,1)}}
.a-terimakasih .bayangan{animation:bayang-makasih 2.2s cubic-bezier(.4,0,.2,1) infinite}
@keyframes bayang-makasih{0%,52%,76%,100%{transform:scale(1);opacity:.22}64%{transform:scale(.6);opacity:.12}}
