<header><img src="__ASET__logo-putih.png" alt="Cheesy Pen Shells"><div class="merek"><b>KASIR ANTRIAN</b><small>Cheesy Pen Shells</small></div><span id="ev" class="kanan"></span></header><main><div id="masuk" class="kartu"><label>PIN kasir</label><input id="pin" type="password" inputmode="numeric"><br><br><button onclick="masuk()">Masuk</button><p id="salah" style="color:var(--merah)"></p></div><div id="isi" style="display:none"><div class="kartu"><label>Event</label><select id="event" onchange="muat()"></select><br><br><label class="tombol kuning" style="text-align:center">📷 Pesanan baru – foto struk<input id="struk" type="file" accept="image/*" capture="environment" style="display:none" onchange="pesananBaru(this)"></label><p id="proses" class="redup"></p><p id="sinkron" class="redup" style="margin:0"></p></div><div class="kolom"><div><h3>⏳ Menunggu</h3><div id="k-MENUNGGU"></div></div><div><h3>🔥 Dibakar</h3><div id="k-DIBAKAR"></div></div><div><h3>✅ Siap / dipanggil</h3><div id="k-SIAP"></div></div></div></div></main><div id="modal"></div><input id="fotoBakar" type="file" accept="image/*" capture="environment" style="display:none"><script src="https://cdn.jsdelivr.net/npm/qrcode-generator@1.4.4/qrcode.js"></script>
<script>
var KUNCI="__K__",EVLINK="__E__";var PIN=KUNCI||localStorage.getItem("cps_pin")||"";var data=[];if(EVLINK)localStorage.setItem("cps_ev",EVLINK);
function el(i){return document.getElementById(i)}function kecilkan(file,cb){var r=new FileReader();r.onload=function(){var g=new Image();g.onload=function(){var m=1280,s=Math.min(1,m/Math.max(g.width,g.height));var c=document.createElement("canvas");c.width=g.width*s;c.height=g.height*s;c.getContext("2d").drawImage(g,0,0,c.width,c.height);cb(c.toDataURL("image/jpeg",0.72))};g.src=r.result};r.readAsDataURL(file)}function masuk(){var p=el("pin").value||PIN;google.script.run.withSuccessHandler(function(r){PIN=p;localStorage.setItem("cps_pin",p);el("masuk").style.display="none";el("isi").style.display="";var s=el("event");s.innerHTML=r.events.map(function(e){return "<option value=\""+e.kode+"\">"+e.kode+" – "+e.kota+"</option>"}).join("");var ingat=localStorage.getItem("cps_ev");if(ingat)s.value=ingat;muat();setInterval(muat,4000)}).withFailureHandler(function(e){el("salah").textContent=e.message;localStorage.removeItem("cps_pin")}).kasirMasuk(p)}function kode(){var k=el("event").value;localStorage.setItem("cps_ev",k);el("ev").textContent=k;return k}function muat(){google.script.run.withSuccessHandler(tampil).daftarAntrian(PIN,kode())}function aman(s){return String(s||"").replace(/[&<>"]/g,function(c){return {"&":"&amp;","<":"&lt;",">":"&gt;","\"":"&quot;"}[c]})}function tampil(d){data=d;var j=new Date();el("sinkron").textContent="🔄 Tersinkron "+("0"+j.getHours()).slice(-2)+":"+("0"+j.getMinutes()).slice(-2)+":"+("0"+j.getSeconds()).slice(-2)+" · boleh dibuka di beberapa HP sekaligus";["MENUNGGU","DIBAKAR","SIAP"].forEach(function(st){el("k-"+st).innerHTML=d.filter(function(o){return o.status===st}).map(kartu).join("")||"<p class=redup>–</p>"})}function kartu(o){var a="";if(o.status==="MENUNGGU")a="<button class=\"kecil\" onclick=\"bakar('"+o.id+"')\">📷 Foto & mulai bakar</button><button class=\"kecil abu\" onclick=\"status('"+o.id+"','DIBAKAR')\">Bakar tanpa foto</button>";if(o.status==="DIBAKAR")a="<button class=\"kecil hijau\" onclick=\"status('"+o.id+"','SIAP')\">🔔 Panggil</button>";if(o.status==="SIAP")a="<button class=\"kecil biru\" onclick=\"status('"+o.id+"','SIAP')\">🔔 Panggil ulang ("+o.panggilKe+"x)</button><button class=\"kecil hijau\" onclick=\"status('"+o.id+"','DIAMBIL')\">✓ Sudah diambil</button>";return "<div class=\"pesanan "+o.status+"\"><img src=\""+(o.fotoBakar||o.fotoStruk)+"\" onclick=\"lihat('"+o.id+"')\"><div class=no>#"+o.nomor+"</div><div class=redup>"+o.dibuat+"</div><div style=\"white-space:pre-line\">"+(aman(o.menu)||"<i class=redup>menu: lihat struk</i>")+"</div><div class=aksi>"+a+"<button class=\"kecil abu\" onclick=\"lihat('"+o.id+"')\">QR / detail</button></div></div>"}function cari(id){return data.filter(function(o){return o.id===id})[0]}function pesananBaru(inp){var f=inp.files[0];inp.value="";if(!f)return;el("proses").textContent="Menyimpan struk & membuat nomor antrian...";kecilkan(f,function(u){google.script.run.withSuccessHandler(function(o){el("proses").textContent="";data.push(o);lihat(o.id,o);muat()}).withFailureHandler(function(e){el("proses").textContent="Gagal: "+e.message}).buatPesanan(PIN,kode(),u)})}function lihat(id,o){o=o||cari(id);if(!o)return;el("modal").innerHTML="<div class=modal onclick=\"if(event.target===this)tutup()\"><div class=kartu><div class=redup style=\"text-align:center\">Nomor antrian</div><div class=nomor>#"+o.nomor+"</div><p style=\"text-align:center\">Minta pelanggan <b>scan QR ini</b> untuk melihat pesanannya:</p><div id=qr style=\"display:flex;justify-content:center;margin:10px 0\"></div><label>Menu (dari struk, bisa diperbaiki)</label><textarea id=menuEdit rows=4>"+aman(o.menu)+"</textarea><br><br><button class=\"kecil hijau\" onclick=\"simpanMenu('"+o.id+"')\">Simpan menu</button> <button class=\"kecil merah\" onclick=\"if(confirm('Batalkan pesanan #"+o.nomor+"?'))status('"+o.id+"','BATAL')\">Batalkan</button><br><br><img class=foto src=\""+o.fotoStruk+"\">"+(o.fotoBakar?"<br><img class=foto src=\""+o.fotoBakar+"\">":"")+"<br><button onclick=\"tutup()\">Tutup</button></div></div>";var q=qrcode(0,"L");q.addData(o.link);q.make();el("qr").innerHTML=q.createSvgTag({cellSize:5,margin:4,scalable:true}).replace("<svg ","<svg style=\"width:min(86vw,380px);height:auto;background:#fff\" ")}function tutup(){el("modal").innerHTML=""}function simpanMenu(id){google.script.run.withSuccessHandler(function(){tutup();muat()}).ubahMenu(PIN,id,el("menuEdit").value)}function status(id,st,foto){google.script.run.withSuccessHandler(function(){tutup();muat()}).withFailureHandler(function(e){tutup();el("proses").textContent="⚠️ "+e.message;setTimeout(function(){el("proses").textContent=""},6000);muat()}).ubahStatus(PIN,id,st,foto||"")}function bakar(id){var i=el("fotoBakar");i.onchange=function(){var f=i.files[0];i.value="";if(!f)return;el("proses").textContent="Menyimpan foto pesanan...";kecilkan(f,function(u){el("proses").textContent="";status(id,"DIBAKAR",u)})};i.click()}if(PIN){el("pin").value=PIN;masuk()}
</script>
