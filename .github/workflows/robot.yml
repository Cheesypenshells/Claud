name: Robot EURUSD

on:
  schedule:
    # Menit ke-3 setiap jam, 07:00-21:59 UTC, Senin-Jumat (mencakup sesi London & New York).
    # Filter jam yang tepat (08:00-21:00 waktu London) ada di dalam robot.
    - cron: "3 7-21 * * 1-5"
  workflow_dispatch: {}   # tombol "Run workflow" untuk menjalankan manual dari HP

concurrency:
  group: robot-eurusd
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Jalankan robot
        run: python -m robot.main
        env:
          METAAPI_TOKEN: ${{ secrets.METAAPI_TOKEN }}
          METAAPI_ACCOUNT_ID: ${{ secrets.METAAPI_ACCOUNT_ID }}
          DRY_RUN: ${{ vars.DRY_RUN || 'true' }}
