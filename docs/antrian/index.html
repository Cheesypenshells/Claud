lihSuara}function bicara(teks){if(!window.speechSynthesis)return;var u=new SpeechSynthesisUtterance(teks);u.lang="id-ID";if(suaraId)u.voice=suaraId;u.rate=0.92;u.pitch=1;u.volume=1;speechSynthesis.speak(u)}function getar(pola){try{if(navigator.vibrate)navigator.vibrate(pola)}catch(e){}}function jagaLayar(){try{if(navigator.wakeLock&&document.visibilityState==="visible")navigator.wakeLock.request("screen").then(function(k){kunciLayar=k}).catch(function(){})}catch(e){}}document.addEventListener("visibilitychange",function(){if(aktif&&document.visibilityState==="visible")jagaLayar()});function lonceng(f,t,dur,vol){var n=ctx.currentTime+t;[[1,1],[2.76,0.35],[5.4,0.12]].forEach(function(h){var o=ctx.createOscillator(),g=ctx.createGain();o.type="sine";o.frequency.value=f*h[0];g.gain.setValueAtTime(0.0001,n);g.gain.exponentialRampToValueAtTime(vol*h[1],n+0.02);g.gain.exponentialRampToValueAtTime(0.0001,n+dur);o.connect(g);g.connect(ctx.destination);o.start(n);o.stop(n+dur+0.05)})}function nada(){if(!ctx)return;if(ctx.state==="suspended")ctx.resume();lonceng(523.25,0,1.6,0.5);lonceng(659.25,0.45,1.6,0.5);lonceng(783.99,0.9,1.6,0.5);lonceng(1046.5,1.35,2.4,0.45)}function aktifkan(){try{ctx=ctx||new (window.AudioContext||window.webkitAudioContext)()}catch(e){}aktif=true;nada();getar(200);jagaLayar();setTimeout(function(){bicara("Bunyi panggilan aktif")},1600);el("bunyi").innerHTML="<p>🔔 <b>Bunyi panggilan aktif.</b> Biarkan halaman ini terbuka, layar akan tetap menyala.</p>"}function umumkan(d){nada();getar([700,250,700,250,1200]);setTimeout(function(){if(window.speechSynthesis)speechSynthesis.cancel();bicara("Nomor antrian "+d.nomor+", sudah boleh datang ke kasir untuk mengambil pesanan kamu. Terima kasih.")},2300)}function panggil(d){ulang=0;umumkan(d);clearInterval(alarm);alarm=setInterval(function(){ulang++;umumkan(d)},11000);el("siap").innerHTML="<div class=siap-besar onclick=\"berhenti()\"><div style=\"font-size:28px;font-weight:800\">OYSTER KAMU SUDAH SIAP!</div><div c
