<!doctype html>
<html lang="id">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Cheesy Pen Shells · Tutor Bahasa AI</title>
  <link rel="icon" href="img/logo.png" type="image/png" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@700;800&family=Caveat:wght@700&family=Nunito:wght@400;700;800&family=Share+Tech+Mono&display=swap" />
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <header class="kepala">
    <img src="img/logo-putih.png" alt="Cheesy Pen Shells" />
    <div class="merek">
      <b>CHEESY PEN SHELLS</b>
      <small>tutor bahasa AI</small>
    </div>
    <span class="sys-chip"><i></i> CHEESY-BOT ONLINE</span>
  </header>

  <div class="app">
    <aside class="sidebar">
      <section class="panel">
        <h2 class="judul"><span>Setelan</span></h2>
        <label>Bahasa yang dipelajari
          <select id="language"></select>
        </label>
        <label>Level
          <select id="level">
            <option value="beginner">Pemula</option>
            <option value="intermediate" selected>Menengah</option>
            <option value="advanced">Mahir</option>
          </select>
        </label>
        <label>Gaya ngajar
          <select id="style">
            <option value="lembut">😇 Lembut — sabar &amp; menyemangati</option>
            <option value="santai" selected>😏 Santai — suka ngeledek dikit</option>
            <option value="pedas">🌶️ Pedas — roasting tanpa ampun</option>
          </select>
        </label>
        <p class="hint">Kadar ledekan juga otomatis naik kalau kamu belajarnya asal-asalan 😉</p>
      </section>

      <section class="panel">
        <h2 class="judul"><span>Pilih Tutor</span></h2>
        <nav id="tutors"></nav>
      </section>

      <section class="panel">
        <h2 class="judul"><span>Suara</span></h2>
        <label class="switch"><input type="checkbox" id="voice-mode" /> <span>🗣️ Mode Suara (ngobrol tanpa mengetik)</span></label>
        <label>Kecepatan suara AI
          <input type="range" id="rate" min="0.6" max="1.2" step="0.05" value="0.95" />
        </label>
        <p class="hint" id="voice-hint"></p>
      </section>

      <section class="panel">
        <h2 class="judul"><span>Ingatan</span></h2>
        <div id="memory-summary" class="mem">Belum ada ingatan. Ayo ngobrol dulu!</div>
        <div class="mem-actions">
          <button id="memory-view" class="ghost" type="button">🧠 Lihat ingatan</button>
          <button id="memory-wipe" class="ghost danger" type="button">Lupakan semua</button>
        </div>
      </section>

      <button id="reset" class="ghost">↺ Hapus chat tutor ini</button>
      <p class="tagar">#oysterbakarfavoritmu</p>
    </aside>

    <main class="chat">
      <div class="chat-head">
        <span id="chat-title"></span>
        <span class="right"><span id="status"></span><button id="robot-open" type="button">🤖 Ngobrol dengan Cheesy-Bot</button></span>
      </div>
      <div id="messages" aria-live="polite"></div>
      <form id="composer">
        <button type="button" id="mic-lang" class="icon-btn small" title="Bahasa yang kamu ucapkan">EN</button>
        <button type="button" id="mic" class="icon-btn" title="Bicara (tekan lalu ucapkan)">🎤</button>
        <textarea id="input" rows="1" placeholder="Tulis, atau tekan 🎤" maxlength="4000"></textarea>
        <button type="submit" id="send">Kirim</button>
      </form>
    </main>
  </div>
  <dialog id="memory-dialog">
    <div class="dlg-head">
      <h2 class="judul"><span>Ingatan Cheesy-Bot</span></h2>
      <button type="button" class="robot-x dlg-x" id="memory-close" title="Tutup">✕</button>
    </div>
    <div id="memory-body"></div>
  </dialog>
  <script src="app.js" type="module"></script>
</body>
</html>
